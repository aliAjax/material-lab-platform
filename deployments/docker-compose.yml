services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: material_lab
      POSTGRES_USER: material_lab
      POSTGRES_PASSWORD: material_lab
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U material_lab"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - material_lab_pg:/var/lib/postgresql/data
      - ../migrations/000001_initial.up.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ../migrations/000002_runtime_repository.up.sql:/docker-entrypoint-initdb.d/002.sql:ro
  api:
    build:
      context: ..
    environment:
      HTTP_ADDRESS: :18080
      DATABASE_URL: postgres://material_lab:material_lab@postgres:5432/material_lab?sslmode=disable
      JWT_SECRET: local-compose-secret-change-before-production
      STORAGE_PATH: /data/uploads
    ports:
      - "18080:18080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - material_lab_files:/data
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "15173:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
volumes:
  material_lab_pg:
  material_lab_files:
